name: Documentation Validation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run markdown linting
      run: npm run lint
      
    - name: Validate internal links
      run: npm run validate:links
      
    - name: Report results
      if: always()
      run: |
        echo "✅ Documentation validation complete"
        echo "All markdown files have been linted and links validated"
